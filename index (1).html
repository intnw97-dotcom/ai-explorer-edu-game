<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Explorer</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28345d,#0b1124 70%);color:#eff5ff;font:16px/1.6 system-ui,sans-serif;min-height:100vh}main{max-width:850px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3{line-height:1.2}h1{font-size:clamp(36px,8vw,66px);letter-spacing:-2px;margin:12px 0;color:#73f4e0}button{font:inherit;cursor:pointer;background:#70e8d7;color:#10223a;border:0;border-radius:12px;padding:12px 18px;font-weight:700}button.secondary{background:#293853;color:#edf5ff;border:1px solid #536887}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #ffda83;outline-offset:3px}.panel{background:#172440;border:1px solid #384c70;border-radius:22px;padding:clamp(18px,4vw,34px);margin:20px 0;box-shadow:0 15px 40px #0004}.hero{text-align:center}.robot{font-size:76px}.muted{color:#b8c9e5}.eyebrow{color:#73f4e0;font-size:13px;letter-spacing:2px;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hero .actions{justify-content:center}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:95px;background:#202f4e;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:23px;color:#73f4e0}progress{width:100%;height:14px;accent-color:#70e8d7}.options{display:grid;gap:10px;margin:18px 0}.options button{text-align:left;background:#243555;color:white;border:1px solid #52698a}.options button.correct{background:#155344;border-color:#70e8d7}.options button.wrong{background:#63313e;border-color:#ff9ca9}.feedback{padding:14px;background:#263854;border-radius:12px;margin-top:12px}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.tile{background:#202f4e;border-radius:14px;padding:14px}.tile strong{color:#73f4e0}footer{font-size:13px;color:#b8c9e5;text-align:center}.sequence{display:flex;gap:8px;flex-wrap:wrap;min-height:48px}.chip{background:#33496a;color:white;padding:8px 12px;border-radius:8px}a{color:#73f4e0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}} </style></head><body><main><header><strong>✦ AI EXPLORER</strong><button id="sound" class="secondary" aria-pressed="false">🔇 Audio mati</button></header><div id="app" aria-live="polite"></div><footer>Game edukasi • Skor bukan sertifikasi kompetensi • Progres tersimpan pada browser ini.</footer></main><script>
const levels=[['AI City','AI, Generative AI dan LLM','🤖','AI membantu komputer melakukan tugas yang biasanya membutuhkan kecerdasan manusia. Generative AI menghasilkan konten baru; LLM adalah model bahasa berskala besar.'],['Technology Lab','Teknologi Generative AI','🧪','GAN memakai generator dan discriminator dalam pelatihan. TTS mengubah teks menjadi suara; text-to-image dan text-to-video menghasilkan visual dari instruksi teks.'],['Prompt Academy','Teknik prompting','🧩','Prompt adalah instruksi untuk AI. Peran, konteks, tugas, batasan dan format membantu memperjelas hasil. Zero-shot berarti tanpa contoh jawaban.'],['Marketing World','AIDA dan SEO','📣','AIDA: Attention, Interest, Desire, Action. SEO membantu mesin pencari memahami konten; kata kunci relevan dan konten bermanfaat lebih baik daripada pengulangan berlebihan.'],['Ethics Fortress','Etika dan keamanan AI','🛡️','AI dapat menghasilkan informasi keliru atau bias. Verifikasi fakta, lindungi data pribadi, dan gunakan karya dengan izin yang sesuai.']];
// [pertanyaan, pilihan, indeks benar, pembahasan, jenis opsional]
const bank=[
['Apa yang dimaksud dengan AI?',['Sistem yang dapat melakukan tugas yang biasanya membutuhkan kecerdasan manusia','Semua perangkat listrik','Hanya aplikasi kamera'],0,'AI mencakup sistem yang melakukan tugas seperti pengenalan pola, prediksi dan pemrosesan bahasa.'],
['Apa fungsi utama Generative AI?',['Mengisi baterai','Menghasilkan konten baru','Memperbaiki kabel'],1,'Generative AI dapat menghasilkan teks, gambar, audio atau konten lain berdasarkan pola yang dipelajari.'],
['LLM merupakan singkatan dari ...',['Local Logic Machine','Long Learning Media','Large Language Model'],2,'LLM adalah model bahasa berskala besar yang dilatih untuk memproses dan menghasilkan bahasa.'],
['Manakah contoh penggunaan Generative AI?',['Membuat draf artikel dari instruksi','Menyalakan lampu biasa','Mengukur panjang dengan penggaris'],0,'Membuat draf dari instruksi merupakan contoh generasi teks.'],
['Apakah semua AI merupakan Generative AI?',['Ya','Tidak','Hanya saat online'],1,'AI juga mencakup sistem klasifikasi, prediksi dan jenis lain yang tidak berfokus pada pembuatan konten.'],
['Cocokkan TTS dengan fungsinya.',['Teks menjadi gambar','Teks menjadi suara','Suara menjadi teks'],1,'Text-to-Speech mengubah teks menjadi ucapan.','matching'],
['Cocokkan Text-to-Image dengan keluarannya.',['Gambar','Suara','Tabel angka'],0,'Text-to-Image menghasilkan gambar dari instruksi teks.','matching'],
['Cocokkan Text-to-Video dengan keluarannya.',['Kata sandi','Spreadsheet','Video'],2,'Text-to-Video menghasilkan video dari instruksi teks.','matching'],
['Pasangan komponen utama GAN adalah ...',['Browser dan server','Generator dan discriminator','Keyboard dan mouse'],1,'Generator membuat sampel dan discriminator belajar membedakan sampel asli dan hasil generator.','matching'],
['Teknologi untuk mengubah rekaman ucapan menjadi tulisan?',['Speech-to-Text','Text-to-Speech','Text-to-Image'],0,'Speech-to-Text mentranskripsikan ucapan menjadi tulisan.','matching'],
['Apa itu prompt?',['Jenis monitor','Instruksi atau masukan untuk AI','Kabel jaringan'],1,'Prompt memberi arahan tentang tugas yang perlu dilakukan AI.'],
['Susun struktur contoh prompt: Peran → Konteks → Tugas → Format.',['Tugas','Format','Peran','Konteks'],[2,3,0,1],'Ini salah satu struktur yang berguna, bukan satu-satunya urutan yang benar.','sequence'],
['Prompt mana yang lebih jelas?',['Buat sesuatu','Buat caption promosi sandwich maksimal 20 kata untuk mahasiswa','Baguskan'],1,'Prompt kedua menyebut tugas, produk, audiens dan batas panjang.'],
['Zero-shot prompting berarti ...',['Memberi instruksi tanpa contoh jawaban','Memberi sepuluh contoh','Tidak memberi instruksi'],0,'Zero-shot memberikan tugas tanpa demonstrasi contoh jawaban dalam prompt.'],
['Apa fungsi batasan dalam prompt?',['Menjamin AI selalu benar','Menghapus kebutuhan verifikasi','Memperjelas ruang lingkup hasil'],2,'Batasan membantu mengarahkan hasil, tetapi tidak menjamin akurasi.'],
['Susun tahapan AIDA yang benar.',['Action','Desire','Attention','Interest'],[2,3,1,0],'AIDA adalah Attention, Interest, Desire, Action.','sequence'],
['Judul promosi yang menarik perhatian termasuk tahap ...',['Action','Attention','Desire'],1,'Attention bertujuan menarik perhatian audiens.'],
['Ajakan “Pesan sekarang” termasuk tahap ...',['Interest','Attention','Action'],2,'Action mengarahkan audiens melakukan tindakan.'],
['Judul SEO yang lebih informatif adalah ...',['Tips membuat sandwich gandum untuk sarapan','Sandwich sandwich sandwich!!!','Klik ini'],0,'Judul yang deskriptif dan relevan membantu pembaca serta mesin pencari memahami isi.'],
['Apakah SEO menjamin peringkat pertama?',['Ya','Tidak','Ya jika kata kunci diulang'],1,'SEO dapat membantu visibilitas, tetapi tidak menjamin peringkat tertentu.'],
['AI memberikan referensi yang tidak ditemukan. Apa tindakan terbaik?',['Langsung publikasikan','Verifikasi referensi pada sumber asli','Tambahkan referensi palsu'],1,'AI bisa berhalusinasi, termasuk menghasilkan referensi yang tidak nyata.'],
['AI membuat generalisasi negatif tentang kelompok tertentu. Ini contoh ...',['Kompresi','Resolusi gambar','Bias'],2,'Bias dapat muncul sebagai stereotip atau perlakuan tidak adil.'],
['Apa tindakan aman terhadap data pribadi pelanggan?',['Hindari memasukkan data sensitif tanpa dasar dan izin yang sesuai','Publikasikan semua data','Bagikan kata sandi'],0,'Minimalkan data pribadi dan ikuti aturan privasi yang berlaku.'],
['Sebelum menggunakan gambar orang lain untuk promosi, sebaiknya ...',['Hapus nama pembuat','Periksa lisensi dan izin penggunaan','Anggap semua gambar bebas digunakan'],1,'Hak penggunaan perlu diperiksa; gambar di internet tidak otomatis bebas digunakan.'],
['AI memberi informasi kesehatan yang meragukan. Apa pilihan terbaik?',['Percaya tanpa pemeriksaan','Sebarkan sebagai fakta','Periksa sumber tepercaya dan konsultasikan tenaga kesehatan bila perlu'],2,'Informasi penting perlu diverifikasi dengan sumber yang kompeten.']];
const $=id=>document.getElementById(id),app=$('app'),KEY='ai-explorer-v1';let state={i:0,results:[],done:false},selected=[],hint=false,view='home',audio=false,ctx,tick;let storageOK=true;try{let raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Number.isInteger(raw.i)&&raw.i>=0&&raw.i<=25&&Array.isArray(raw.results)&&raw.results.length===raw.i&&raw.results.every(x=>typeof x==='boolean'))state=raw}catch(e){storageOK=false}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}}function score(){return state.results.filter(Boolean).length*100}function rank(){return score()===2500?'AI Grand Master':score()>=2000?'AI Master':score()>=1500?'AI Specialist':score()>=1000?'AI Explorer':'AI Beginner'}function tone(f=440,len=.12,vol=.035){if(!audio||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+len);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+len)}$('sound').onclick=async()=>{try{if(!audio){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();audio=true;let k=0;tick=setInterval(()=>tone([220,277,330,440][k++%4],.5,.012),850)}else{audio=false;clearInterval(tick);await ctx.suspend()}$('sound').textContent=audio?'🔊 Audio aktif':'🔇 Audio mati';$('sound').setAttribute('aria-pressed',audio)}catch(e){audio=false;clearInterval(tick);$('sound').textContent='Audio tidak tersedia'}};
function home(){view='home';app.innerHTML=`<section class="panel hero"><div class="robot">🤖</div><div class="eyebrow">EDUCATIONAL ADVENTURE</div><h1>AI EXPLORER</h1><p>Explore, Learn, and Master AI!</p><p class="muted">Bantu NOVA memulihkan lima inti pengetahuan di AI Universe. LUMI akan membantumu menghadapi gangguan GLITCH.</p><div class="actions"><button id="start">${state.i&&!state.done?'Lanjutkan misi':'Mulai petualangan'}</button><button class="secondary" id="guide">Petunjuk</button>${state.done?'<button class="secondary" id="old">Lihat hasil</button>':''}${state.i&&!state.done?'<button class="secondary" id="reset">Mulai ulang</button>':''}</div></section><div class="map">${levels.map((l,i)=>`<div class="tile">${l[2]} <strong>Level ${i+1}</strong><br>${l[0]}<br><small class="muted">${l[1]}</small></div>`).join('')}</div>${storageOK?'':'<p>Progres lokal tidak tersedia pada browser ini.</p>'}`;$('start').onclick=()=>{if(state.done)reset();else if(state.i%5===0)intro();else question()};$('guide').onclick=guide;if($('old'))$('old').onclick=result;if($('reset'))$('reset').onclick=()=>{if(confirm('Hapus progres dan mulai ulang?'))reset()}}
function guide(){view='guide';app.innerHTML=`<section class="panel"><h2>Petunjuk permainan</h2><p>Jawab 25 tantangan dalam 5 level. Pilih jawaban atau susun kartu sesuai instruksi. Jawaban benar bernilai 100 poin; jawaban salah mengurangi satu nyawa per level. Nyawa kembali menjadi lima pada level berikutnya. Tidak ada batas waktu. Setelah setiap jawaban, baca pembahasan LUMI. Progres disimpan setelah jawaban diperiksa.</p><p>Gunakan tombol audio untuk mengaktifkan musik elektronik sederhana dan efek suara. Peringkat akhir adalah penghargaan permainan, bukan sertifikat.</p><button id="back">Kembali</button></section>`;$('back').onclick=home}
function reset(){state={i:0,results:[],done:false};save();intro()}function intro(){if(state.i>=25)return result();view='intro';let l=levels[Math.floor(state.i/5)];app.innerHTML=`<section class="panel"><div class="eyebrow">MISI ${Math.floor(state.i/5)+1} / 5</div><h1>${l[2]} ${l[0]}</h1><h3>${l[1]}</h3><p><strong>💡 Briefing LUMI</strong></p><p>${l[3]}</p><p class="muted">Selesaikan 5 tantangan untuk memperoleh inti pengetahuan.</p><div class="actions"><button id="go">Mulai misi</button><button class="secondary" id="back">Kembali</button></div></section>`;$('go').onclick=question;$('back').onclick=home}
function question(){if(state.i>=25)return result();view='question';selected=[];hint=false;let i=state.i,q=bank[i],level=Math.floor(i/5),seq=q[4]==='sequence',lives=5-state.results.slice(level*5).filter(x=>!x).length;app.innerHTML=`<div class="stats"><div class="stat">Skor<b>${score()}</b></div><div class="stat">Nyawa<b>♥ ${lives}</b></div><div class="stat">Level<b>${level+1}/5</b></div></div><p class="muted">Progres ${i}/25</p><progress max="25" value="${i}"></progress><section class="panel"><div class="eyebrow">${levels[level][0]} • ${seq?'PUZZLE':q[4]==='matching'?'MATCHING':'QUIZ'} • ${i%5+1}/5</div><h2>${q[0]}</h2>${seq?'<p class="muted">Ketuk kartu sesuai urutan, lalu periksa.</p><div class="sequence" id="ordered"></div>':''}<div class="options">${q[1].map((v,j)=>`<button data-choice="${j}">${v}</button>`).join('')}</div>${seq?'<div class="actions"><button id="check" disabled>Periksa urutan</button><button id="clear" class="secondary">Hapus urutan</button></div>':''}<div id="feedback"></div><div class="actions"><button class="secondary" id="hint">💡 Petunjuk</button><button class="secondary" id="back">Menu utama</button></div></section>`;let buttons=[...app.querySelectorAll('[data-choice]')];function paint(){ $('ordered').innerHTML=selected.map(j=>`<span class="chip">${q[1][j]}</span>`).join('');buttons.forEach((b,j)=>b.disabled=selected.includes(j));$('check').disabled=selected.length!==q[1].length}buttons.forEach((b,j)=>b.onclick=()=>{if(seq){selected.push(j);paint()}else answer(j===q[2],j)});if(seq){$('clear').onclick=()=>{selected=[];paint()};$('check').onclick=()=>answer(selected.every((v,j)=>v===q[2][j]))}$('hint').onclick=()=>{$('feedback').innerHTML=`<div class="feedback">💡 ${levels[level][3]}</div>`};$('back').onclick=home;function answer(ok,j){if(state.i!==i)return;state.results.push(ok);state.i++;state.done=state.i===25;save();tone(ok?660:165,.24);buttons.forEach((b,k)=>{b.disabled=true;if(!seq&&k===q[2])b.classList.add('correct');if(!seq&&!ok&&k===j)b.classList.add('wrong')});if(seq){$('check').disabled=true;$('clear').disabled=true}$('hint').disabled=true;app.querySelectorAll('.stat b')[0].textContent=score();app.querySelectorAll('.stat b')[1].textContent='♥ '+(lives-(ok?0:1));app.querySelector('progress').value=state.i;app.querySelector('progress').previousElementSibling.textContent=`Progres ${state.i}/25`;$('feedback').innerHTML=`<div class="feedback"><strong>${ok?'✓ Tepat! +100 poin':'Belum tepat. Tetap semangat!'}</strong><p>Jawaban: ${seq?q[2].map(k=>q[1][k]).join(' → '):q[1][q[2]]}</p><p>💡 LUMI: ${q[3]}</p><button id="next">${state.done?'Lihat hasil':state.i%5===0?'Misi berikutnya':'Lanjutkan'}</button></div>`;$('next').onclick=()=>state.done?result():state.i%5===0?intro():question();$('next').focus()}}
function result(){view='result';app.innerHTML=`<section class="panel hero"><div class="robot">🏆</div><div class="eyebrow">PETUALANGAN SELESAI</div><h1>${rank()}</h1><h2>${score()} / 2500 poin</h2><p>${state.results.filter(Boolean).length} dari 25 jawaban benar</p><div class="map">${levels.map((l,i)=>`<div class="tile">${l[2]} ${l[0]}<br><strong>${state.results.slice(i*5,i*5+5).filter(Boolean).length}/5</strong></div>`).join('')}</div><div class="actions"><button id="again">Ulangi permainan</button><button class="secondary" id="review">Evaluasi jawaban</button><button class="secondary" id="back">Menu utama</button></div></section>`;$('again').onclick=reset;$('back').onclick=home;$('review').onclick=()=>{app.innerHTML=`<section class="panel"><h2>Evaluasi pembelajaran</h2>${bank.map((q,i)=>`<p><strong>${i+1}. ${state.results[i]?'✓':'✗'} ${q[0]}</strong><br>${Array.isArray(q[2])?q[2].map(k=>q[1][k]).join(' → '):q[1][q[2]]}<br><span class="muted">${q[3]}</span></p>`).join('')}<button id="back">Kembali ke hasil</button></section>`;$('back').onclick=result}}home();</script></body></html>
